<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Enter Passcode</title>

    <!-- Centralized Theme Manager & Floating Drop-up Switcher -->
    <script>
        (function() {
            const script = document.createElement('script');
            script.src = window.location.protocol === 'file:' ? 'js/theme.js' : '/js/theme.js';
            document.head.appendChild(script);
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --bg-page: #f2f2f7;
            --text-title: #000000;
            --text-subtitle: #8e8e93;
            --text-error: #ff3b30;
            --dot-border: rgba(60, 60, 67, 0.35);
            --dot-fill: #000000;
            --key-bg: rgba(255, 255, 255, 0.85);
            --key-bg-active: rgba(200, 200, 205, 0.85);
            --key-text: #000000;
            --key-subtext: #8e8e93;
            --action-color: #007aff;
            color-scheme: light;
        }

        [data-theme="dark"] {
            --bg-page: #000000;
            --text-title: #ffffff;
            --text-subtitle: #8e8e93;
            --text-error: #ff453a;
            --dot-border: rgba(235, 235, 245, 0.35);
            --dot-fill: #ffffff;
            --key-bg: rgba(255, 255, 255, 0.12);
            --key-bg-active: rgba(255, 255, 255, 0.28);
            --key-text: #ffffff;
            --key-subtext: rgba(235, 235, 245, 0.55);
            --action-color: #0a84ff;
            color-scheme: dark;
        }

        body {
            font-family: var(--font-system);
            background-color: var(--bg-page);
            color: var(--text-title);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: max(40px, env(safe-area-inset-top, 40px)) 20px max(40px, env(safe-area-inset-bottom, 40px));
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .passcode-container {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: auto;
            margin-bottom: auto;
        }

        /* Top Header & Lock Icon */
        .lock-icon-wrapper {
            margin-bottom: 14px;
            color: var(--text-subtitle);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .lock-icon-wrapper svg {
            width: 28px;
            height: 28px;
        }

        .passcode-title {
            font-size: 21px;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 6px;
            color: var(--text-title);
            text-align: center;
            transition: color 0.2s ease;
        }

        .passcode-subtitle {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-subtitle);
            text-align: center;
            min-height: 18px;
            transition: color 0.2s ease;
        }

        .passcode-subtitle.error {
            color: var(--text-error);
            font-weight: 500;
        }

        /* The 4 Passcode Dots */
        .dots-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 32px 0 44px;
        }

        .dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 1.5px solid var(--dot-border);
            background: transparent;
            transition: all 0.16s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dot.filled {
            background-color: var(--dot-fill);
            border-color: var(--dot-fill);
            transform: scale(1.15);
        }

        /* iOS Lockscreen Shake on Error */
        .dots-row.shake {
            animation: iosShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes iosShake {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-14px); }
            30% { transform: translateX(12px); }
            45% { transform: translateX(-10px); }
            60% { transform: translateX(8px); }
            75% { transform: translateX(-4px); }
            90% { transform: translateX(2px); }
        }

        /* Apple HIG Numeric Keypad Grid */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 75px);
            grid-gap: 18px 24px;
            justify-content: center;
            align-items: center;
        }

        .key {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: var(--key-bg);
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            position: relative;
            transition: background-color 0.12s ease, transform 0.1s ease;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        .key:active {
            background-color: var(--key-bg-active);
            transform: scale(0.96);
        }

        .key-num {
            font-size: 32px;
            line-height: 1;
            font-weight: 400;
            color: var(--key-text);
            letter-spacing: -0.02em;
        }

        .key-letters {
            font-size: 9px;
            line-height: 1;
            font-weight: 600;
            letter-spacing: 0.14em;
            color: var(--key-subtext);
            text-transform: uppercase;
            margin-top: 3px;
        }

        /* Keypad Action Slots (Cancel / Delete) */
        .key-action {
            width: 75px;
            height: 75px;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-title);
            transition: opacity 0.15s ease;
            opacity: 0;
            pointer-events: none;
        }

        .key-action.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .key-action:active {
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <div class="passcode-container">
        <!-- Padlock Icon -->
        <div class="lock-icon-wrapper" id="lockIcon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <h1 class="passcode-title">Enter Passcode</h1>
        <p class="passcode-subtitle" id="feedbackText">Enter 4-digit code to continue</p>

        <!-- Passcode Dots -->
        <div class="dots-row" id="dotsContainer">
            <div class="dot" data-index="0"></div>
            <div class="dot" data-index="1"></div>
            <div class="dot" data-index="2"></div>
            <div class="dot" data-index="3"></div>
        </div>

        <!-- Apple HIG Numeric Keypad -->
        <div class="keypad">
            <button type="button" class="key" data-key="1">
                <span class="key-num">1</span>
                <span class="key-letters">&nbsp;</span>
            </button>
            <button type="button" class="key" data-key="2">
                <span class="key-num">2</span>
                <span class="key-letters">ABC</span>
            </button>
            <button type="button" class="key" data-key="3">
                <span class="key-num">3</span>
                <span class="key-letters">DEF</span>
            </button>

            <button type="button" class="key" data-key="4">
                <span class="key-num">4</span>
                <span class="key-letters">GHI</span>
            </button>
            <button type="button" class="key" data-key="5">
                <span class="key-num">5</span>
                <span class="key-letters">JKL</span>
            </button>
            <button type="button" class="key" data-key="6">
                <span class="key-num">6</span>
                <span class="key-letters">MNO</span>
            </button>

            <button type="button" class="key" data-key="7">
                <span class="key-num">7</span>
                <span class="key-letters">PQRS</span>
            </button>
            <button type="button" class="key" data-key="8">
                <span class="key-num">8</span>
                <span class="key-letters">TUV</span>
            </button>
            <button type="button" class="key" data-key="9">
                <span class="key-num">9</span>
                <span class="key-letters">WXYZ</span>
            </button>

            <!-- Bottom Row: Blank, 0, Delete -->
            <div class="key-action"></div>
            <button type="button" class="key" data-key="0">
                <span class="key-num">0</span>
                <span class="key-letters">&nbsp;</span>
            </button>
            <button type="button" class="key-action" id="deleteBtn" aria-label="Delete digit">Delete</button>
        </div>
    </div>

    <script>
        // Passcode Logic & State
        let currentPin = '';
        const MAX_DIGITS = 4;
        let isProcessing = false;

        const dots = document.querySelectorAll('.dot');
        const dotsContainer = document.getElementById('dotsContainer');
        const deleteBtn = document.getElementById('deleteBtn');
        const feedbackText = document.getElementById('feedbackText');
        const lockIcon = document.getElementById('lockIcon');

        // Haptic feedback for touch devices (iOS/Android)
        function triggerHaptic(type = 'light') {
            if (navigator.vibrate) {
                if (type === 'error') {
                    navigator.vibrate([40, 60, 40]);
                } else {
                    navigator.vibrate(12);
                }
            }
        }

        function updateDots() {
            dots.forEach((dot, idx) => {
                dot.classList.toggle('filled', idx < currentPin.length);
            });
            deleteBtn.classList.toggle('visible', currentPin.length > 0);
        }

        function addDigit(digit) {
            if (isProcessing || currentPin.length >= MAX_DIGITS) return;
            currentPin += digit;
            triggerHaptic('light');
            updateDots();

            if (currentPin.length === MAX_DIGITS) {
                handleSubmitPin(currentPin);
            }
        }

        function deleteDigit() {
            if (isProcessing || currentPin.length === 0) return;
            currentPin = currentPin.slice(0, -1);
            triggerHaptic('light');
            feedbackText.classList.remove('error');
            feedbackText.textContent = 'Enter 4-digit code to continue';
            updateDots();
        }

        function handlePinError(message = 'Incorrect passcode') {
            isProcessing = true;
            triggerHaptic('error');
            feedbackText.textContent = message;
            feedbackText.classList.add('error');
            dotsContainer.classList.add('shake');

            setTimeout(() => {
                dotsContainer.classList.remove('shake');
                currentPin = '';
                updateDots();
                isProcessing = false;
            }, 600);
        }

        // Submits the PIN to the Edge Gate or validates
        async function handleSubmitPin(pin) {
            isProcessing = true;
            feedbackText.classList.remove('error');
            feedbackText.textContent = 'Verifying...';

            try {
                // Cloudflare Worker Edge Gate endpoint
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: pin })
                });

                if (response.ok) {
                    feedbackText.textContent = 'Unlocked!';
                    lockIcon.style.color = '#34c759'; // Apple success green
                    setTimeout(() => {
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirectUrl = urlParams.get('redirect');
                        if (redirectUrl) {
                            window.location.href = redirectUrl;
                        } else {
                            window.location.reload();
                        }
                    }, 350);
                } else {
                    handlePinError('Incorrect passcode');
                }
            } catch (err) {
                // Fallback for standalone/local testing demo: accepts '1234'
                if (window.location.protocol === 'file:' && pin === '1234') {
                    feedbackText.textContent = 'Unlocked!';
                    lockIcon.style.color = '#34c759';
                    setTimeout(() => {
                        window.location.href = './index.html';
                    }, 400);
                } else {
                    handlePinError('Incorrect passcode');
                }
            }
        }

        // Keypad button listeners
        document.querySelectorAll('.key').forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault();
                addDigit(button.dataset.key);
            });
        });

        deleteBtn.addEventListener('click', (e) => {
            e.preventDefault();
            deleteDigit();
        });

        // Physical Keyboard listener (MacBook / Desktop)
        window.addEventListener('keydown', (e) => {
            if (/^[0-9]$/.test(e.key)) {
                addDigit(e.key);
            } else if (e.key === 'Backspace') {
                deleteDigit();
            } else if (e.key === 'Escape') {
                currentPin = '';
                updateDots();
            }
        });
    </script>
</body>

</html>
