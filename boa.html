<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generator</title>
    <!-- Centralized Theme Manager & Floating Drop-up Switcher -->
    <script src="js/theme.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg-body: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --card-bg: #ffffff;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-text: #0f172a;
            --accordion-border: #e2e8f0;
            --accordion-content-bg: #f8fafc;
            --accordion-content-border: #f1f5f9;
            --btn-primary: #0055c4;
            --btn-primary-hover: #003a8c;
            --btn-primary-active: #002d6e;
            --floating-bg: rgba(255, 255, 255, 0.88);
            --floating-border: rgba(148, 163, 184, 0.28);
            --floating-shadow: 0 8px 24px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            --pill-active-bg: #0f172a;
            --pill-active-text: #ffffff;
            --pill-inactive-text: #64748b;
            color-scheme: light;
        }

        [data-theme="dark"] {
            --bg-body: #090d16;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --card-bg: #131a29;
            --input-bg: #182236;
            --input-border: #2b3952;
            --input-text: #f8fafc;
            --accordion-border: #243048;
            --accordion-content-bg: #101623;
            --accordion-content-border: #1d283d;
            --btn-primary: #2563eb;
            --btn-primary-hover: #1d4ed8;
            --btn-primary-active: #1e40af;
            --floating-bg: rgba(19, 26, 41, 0.88);
            --floating-border: rgba(255, 255, 255, 0.12);
            --floating-shadow: 0 12px 36px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.3);
            --pill-active-bg: #38bdf8;
            --pill-active-text: #090d16;
            --pill-inactive-text: #94a3b8;
            color-scheme: dark;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px 16px 84px;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .controls {
            width: 100%;
            max-width: 454px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .controls h2 {
            margin: 0 0 4px 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .row {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .field {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        label {
            font-weight: 600;
            font-size: .9rem;
            color: var(--text-secondary);
            margin-bottom: .275rem;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 1.2rem;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--input-text);
            -webkit-appearance: none;
            appearance: none;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #0055c4;
            box-shadow: 0 0 0 3px rgba(0, 85, 196, 0.15);
        }

        details {
            border: 1px solid var(--accordion-border);
            border-radius: 6px;
            background: var(--card-bg);
            overflow: hidden;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        summary {
            padding: 10px 12px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        summary:hover {
            color: var(--btn-primary);
        }

        .accordion-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid var(--accordion-content-border);
            background: var(--accordion-content-bg);
            transition: background-color 0.2s ease;
        }

        .save-btn {
            background-color: var(--btn-primary);
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            margin-top: 4px;
            transition: background-color 0.15s ease;
        }

        .save-btn:hover {
            background-color: var(--btn-primary-hover);
        }

        .save-btn:active {
            background-color: var(--btn-primary-active);
        }

        .preview {
            width: 100%;
            max-width: 454px;
            display: flex;
            justify-content: center;
        }

        #receipt-svg {
            width: 100%;
            height: auto;
            max-width: 454px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
            background: white;
            border-radius: 4px;
            display: block;
            transition: filter 0.2s ease, box-shadow 0.2s ease;
        }

        [data-theme="dark"] #receipt-svg {
            filter: invert(0.92) hue-rotate(180deg) brightness(0.95);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>

<body>

    <!-- 1. THE WEB FORM -->
    <div class="controls">
        <h2>Edit Receipt</h2>

        <div class="row">
            <div class="field">
                <label>Amount ($)</label>
                <input type="text" id="inputAmount" inputmode="decimal" oninput="updateReceipt()"
                    onblur="formatAmountInput()" onchange="formatAmountInput()">
            </div>
            <div class="field">
                <label>Military Time</label>
                <input type="text" id="inputTime" inputmode="numeric" maxlength="5" placeholder="HH:MM"
                    oninput="handleTimeInput()" onblur="formatTimeInput()" onchange="formatTimeInput()">
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label>Serial Number</label>
                <input type="text" id="inputSerial" inputmode="decimal" maxlength="4" oninput="handleSerialInput()">
            </div>
            <div class="field">
                <label>Date</label>
                <input type="date" id="inputDate" oninput="updateReceipt()" onchange="updateReceipt()">
            </div>
        </div>

        <details>
            <summary>Location Settings (Optional)</summary>
            <div class="accordion-content">
                <div class="field">
                    <label>Street Address</label>
                    <input type="text" id="inputStreet" value="*GRIFFIN ROAD" oninput="updateReceipt()">
                </div>
                <div class="field">
                    <label>City</label>
                    <input type="text" id="inputCity" value="COOPER CITY" oninput="updateReceipt()">
                </div>
            </div>
        </details>

        <button class="save-btn" onclick="downloadImage()">Save / Download Image</button>
    </div>

    <!-- 3. THE SCRIPT TO LINK THE FORM, SVG, AND IMAGE DOWNLOADER -->
    <script>
        // Formats a value for SVG display with a dollar sign and 2 decimals ($5.00)
        function formatReceiptAmount(val) {
            if (!val || !val.trim()) return '';
            const cleaned = String(val).replace(/[^0-9.]/g, '');
            if (!cleaned) return '';
            const num = parseFloat(cleaned);
            if (isNaN(num)) return '';
            return `$${num.toFixed(2)}`;
        }

        // Formats a date from YYYY-MM-DD to MM/DD/YY (e.g. 04/29/26 or 12/29/25)
        function formatReceiptDate(val) {
            if (!val) return '';
            if (/^\d{4}-\d{2}-\d{2}$/.test(val)) {
                const parts = val.split('-');
                const y = parts[0].slice(-2);
                const m = parts[1];
                const d = parts[2];
                return `${m}/${d}/${y}`;
            }
            return val;
        }

        // Formats the input field itself into 2 decimal format (e.g. 5 -> 5.00, 13 -> 13.00)
        function formatAmountInput() {
            const input = document.getElementById('inputAmount');
            if (!input || !input.value.trim()) return;
            const cleaned = input.value.replace(/[^0-9.]/g, '');
            if (cleaned === '') return;
            const num = parseFloat(cleaned);
            if (!isNaN(num)) {
                input.value = num.toFixed(2);
            }
            updateReceipt();
        }

        // Restricts Serial Number to digits and at most 4 characters while typing
        function handleSerialInput() {
            const input = document.getElementById('inputSerial');
            if (!input) return;
            input.value = input.value.replace(/\D/g, '').slice(0, 4);
            updateReceipt();
        }

        // Auto-formats Military Time with a colon as numbers are typed on the numeric keypad
        function handleTimeInput() {
            const input = document.getElementById('inputTime');
            if (!input) return;
            const digits = input.value.replace(/\D/g, '').slice(0, 4);
            if (digits.length >= 3) {
                input.value = `${digits.slice(0, 2)}:${digits.slice(2)}`;
            } else {
                input.value = digits;
            }
            updateReceipt();
        }

        // Ensures time is properly formatted (e.g. 945 -> 09:45) on blur
        function formatTimeInput() {
            const input = document.getElementById('inputTime');
            if (!input || !input.value.trim()) return;
            let digits = input.value.replace(/\D/g, '').slice(0, 4);
            if (digits.length === 3) {
                digits = '0' + digits;
            } else if (digits.length === 1 || digits.length === 2) {
                digits = digits.padStart(2, '0') + '00';
            }
            if (digits.length === 4) {
                input.value = `${digits.slice(0, 2)}:${digits.slice(2)}`;
            }
            updateReceipt();
        }

        // Update the SVG immediately when typing
        function updateReceipt() {
            const rawAmt = document.getElementById('inputAmount').value;
            const amt = formatReceiptAmount(rawAmt);
            const rawDate = document.getElementById('inputDate').value;
            const date = formatReceiptDate(rawDate);
            const time = document.getElementById('inputTime').value;
            const serial = document.getElementById('inputSerial').value;

            // Helper function to safely target text inside specific SVG groups
            const updateText = (id, val) => {
                const el = document.querySelector(`#${id} text`);
                if (el) el.textContent = val;
            };

            // Updates the amount in all 3 places automatically
            updateText('Amount', amt);
            updateText('Amount1', amt);
            updateText('Amount2', amt);

            // Updates both Date locations automatically
            updateText('Date', date);
            updateText('Date1', date);

            // Updates time and serial number
            updateText('TimeMilitary', time);
            updateText('SerialNumber', serial);

            // Updates location fields
            const streetEl = document.querySelector('#LocationStreet text');
            const inputStreet = document.getElementById('inputStreet');
            if (streetEl && inputStreet) {
                const rawStreet = inputStreet.value.trim();
                streetEl.textContent = rawStreet ? (rawStreet.startsWith('*') ? rawStreet.toUpperCase() : `*${rawStreet.toUpperCase()}`) : '';
            }

            const cityEl = document.getElementById('CityName');
            const inputCity = document.getElementById('inputCity');
            if (cityEl && inputCity) {
                cityEl.textContent = inputCity.value.trim().toUpperCase();
            }
        }

        // Converts the live SVG into a PNG and shares/downloads it (supports "Save to Photos" on mobile)
        function downloadImage() {
            // Ensure amount and time are formatted if entered
            formatAmountInput();
            formatTimeInput();

            const svg = document.getElementById('receipt-svg');
            const svgData = new XMLSerializer().serializeToString(svg);

            // Create a virtual canvas to draw the image onto
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();

            // Set canvas size matching raw file
            canvas.width = 454;
            canvas.height = 766;

            img.onload = function () {
                // Add a white background to the image
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw the SVG over the background
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                canvas.toBlob(async (blob) => {
                    if (!blob) return;

                    // If mobile share sheet is supported (allows "Save Image" directly to Photos on iOS/Android)
                    const file = new File([blob], 'Receipt.png', { type: 'image/png' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'Receipt'
                            });
                            return;
                        } catch (err) {
                            if (err.name === 'AbortError') return; // User closed sheet
                        }
                    }

                    // Fallback for desktop or browsers without file sharing
                    const url = URL.createObjectURL(blob);
                    const downloadLink = document.createElement('a');
                    downloadLink.download = 'Receipt.png';
                    downloadLink.href = url;
                    downloadLink.click();
                    setTimeout(() => URL.revokeObjectURL(url), 1500);
                }, 'image/png');
            };

            // Encode the SVG safely so the browser can read it as an image source
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
        }

        // Initialize dynamic values on page load / refresh
        function initializeDefaults() {
            const now = new Date();

            // Sync current date (YYYY-MM-DD for native date picker)
            const yearFull = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateInput = document.getElementById('inputDate');
            if (dateInput) {
                dateInput.value = `${yearFull}-${month}-${day}`;
            }

            // Amount and Serial Number remain blank on refresh
            const amountInput = document.getElementById('inputAmount');
            if (amountInput && amountInput.value.trim()) {
                formatAmountInput();
            }

            // Render to SVG
            updateReceipt();
        }

        // Pressing Enter in the Amount input will format and commit it
        const amountEl = document.getElementById('inputAmount');
        if (amountEl) {
            amountEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    formatAmountInput();
                    amountEl.blur();
                }
            });
        }

        // Pressing Enter in the Serial Number input will commit it
        const serialEl = document.getElementById('inputSerial');
        if (serialEl) {
            serialEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    handleSerialInput();
                    serialEl.blur();
                }
            });
        }

        // Pressing Enter in the Time input will format and commit it
        const timeEl = document.getElementById('inputTime');
        if (timeEl) {
            timeEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    formatTimeInput();
                    timeEl.blur();
                }
            });
        }

        // Run initialization immediately on load
        window.addEventListener('DOMContentLoaded', initializeDefaults);
        // Fallback in case DOM is already parsed
        if (document.readyState === 'interactive' || document.readyState === 'complete') {
            initializeDefaults();
        }
    </script>
